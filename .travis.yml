sudo: false
dist: jammy
language: android
jdk: openjdk17

before_install:
  - chmod +x gradlew
  - printf 'sdk.dir=%s\nOPEN_WEATHER_APP_ID=%s\n' "$ANDROID_HOME" "$OPEN_WEATHER_APP_ID" > local.properties

android:
  components:
    - tools
    - platform-tools
    - build-tools-33.0.2
    - android-33
    - extra-android-m2repository

script:
  - ./gradlew testDebugUnitTest assembleDebug assembleRelease
