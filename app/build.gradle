apply plugin: 'com.android.application'
apply plugin: 'realm-android'

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def openWeatherAppId = localProperties.getProperty('OPEN_WEATHER_APP_ID', '')

android {
    namespace 'pl.com.chodera.myweather'
    compileSdkVersion 33
    buildToolsVersion "33.0.2"

    defaultConfig {
        applicationId "pl.adamchodera.myweather"
        minSdkVersion 16
        targetSdkVersion 33
        versionCode 6
        versionName "1.5"
        buildConfigField "String", "OPEN_WEATHER_APP_ID", "\"${openWeatherAppId}\""
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        disable 'InvalidPackage'
        abortOnError false
        ignoreWarnings false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    final SUPPORT_LIBRARY_VERSION = '28.0.0'
    final RETROFIT_LIBRARY_VERSION = '2.9.0'

    // ui
    implementation "com.android.support:support-v4:$SUPPORT_LIBRARY_VERSION"
    implementation "com.android.support:appcompat-v7:$SUPPORT_LIBRARY_VERSION"
    implementation "com.android.support:design:$SUPPORT_LIBRARY_VERSION"
    implementation "com.android.support:cardview-v7:$SUPPORT_LIBRARY_VERSION"
    implementation "com.android.support:recyclerview-v7:$SUPPORT_LIBRARY_VERSION"
    implementation 'com.github.PhilJay:MPAndroidChart:v2.2.5'

    // networking
    implementation "com.squareup.retrofit2:retrofit:$RETROFIT_LIBRARY_VERSION"
    implementation "com.squareup.retrofit2:converter-gson:$RETROFIT_LIBRARY_VERSION"
    implementation 'com.google.code.gson:gson:2.10.1'

    // bindings
    implementation 'com.jakewharton:butterknife:8.8.1'
    annotationProcessor 'com.jakewharton:butterknife-compiler:8.8.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation "com.squareup.retrofit2:retrofit:$RETROFIT_LIBRARY_VERSION"

    // LeakCanary
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:1.6.3'
    releaseImplementation 'com.squareup.leakcanary:leakcanary-android-no-op:1.6.3'
    testImplementation 'com.squareup.leakcanary:leakcanary-android-no-op:1.6.3'
}
